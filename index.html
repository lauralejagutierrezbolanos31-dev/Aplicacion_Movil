<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de clic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Interactividad con el DOM</h1>
    <p class="description">
      Haz clic en el botón para incrementar el contador y registrar la hora exacta del evento en la tabla.
    </p>

    <div id="contador">0</div>

    <div class="botones">
      <button id="btn-like">¡Haz Clic Aquí!</button>
      <button id="btn-reset">Reiniciar</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nº Clic</th>
          <th>Hora</th>
        </tr>
      </thead>
      <tbody id="tabla-registros"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
